 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>EnVie</title>


    <meta name="theme-color" content="#6FAFC4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EnVie">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🌱
    </div>

    <h1>EnVie</h1>

    <p>
        Toutes nos idées,
        <br>
        au même endroit.
    </p>

</header>

<main>

    <button id="btnEnvie" class="mainButton">

        <span class="emoji">
            💡
        </span>

        <span>
            Une envie
        </span>

    </button>

    <section class="card">

        <h2>
            Bienvenue 👋
        </h2>

        <p>
            EnVie est votre mémoire familiale.
            Capturez une idée en quelques secondes,
            puis enrichissez-la plus tard.
        </p>

    </section>
<section class="inboxSection">

 <h2
    id="inboxTitle"
    class="sectionTitle"
>
    📥 À trier
</h2>


    <section id="enviesContainer"></section>

</section>



</main>
<div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal">

        <h2>💡 Une envie</h2>

        <input
            id="envieInput"
            type="text"
            placeholder="Mon envie..."
        >
        <div id="categorieSelector" class="categorieSelector">

    <button class="categorieChip active"
            data-categorie="general">
        💡 Général
    </button>

    <button class="categorieChip"
            data-categorie="voyage">
        ✈️ Voyage
    </button>

    <button class="categorieChip"
            data-categorie="maison">
        🏠 Maison
    </button>

    <button class="categorieChip"
            data-categorie="jardin">
        🌿 Jardin
    </button>

    <button class="categorieChip"
            data-categorie="courses">
        🛒 Courses
    </button>

    <button class="categorieChip"
            data-categorie="evenement">
        📅 Événement
    </button>

</div>
<div class="field">

    <label>📍 Lieu</label>

    <input
        id="envieLieu"
        type="text"
        placeholder="Ajouter un lieu">

    <button
        id="btnLocate"
        class="secondaryButton">

        📍 Me localiser

    </button>

    <div id="lieuSuggestions"></div>

</div>
<div class="field">

    <label>📅 Date ou période</label>

    <input
        id="envieDate"
        type="date">

</div>
        <div class="modal-actions">

            <button id="cancelModal">
                Annuler
            </button>

            <button id="saveEnvie">
                Ajouter
            </button>

        </div>


    </div>

</div>

<div
    id="deleteModal"
    class="modal-overlay hidden">

    <div class="modal">

        <h2>🗑️ Supprimer ?</h2>

        <p id="deleteText">
            Cette envie sera supprimée définitivement.
        </p>

        <div class="modal-actions">

            <button id="cancelDelete">
                Annuler
            </button>

            <button id="confirmDelete">
                Supprimer
            </button>

        </div>

    </div>

</div>
<div id="ficheOverlay" class="modal-overlay hidden">

    <div class="modal">

        <button
            id="closeFiche"
            class="backButton">

            ← Retour

        </button>

        <h2 id="ficheTitre"></h2>

        <p id="ficheCategorie"></p>
        <div class="ficheSection">

    <label>📍 Lieu</label>

    <input
        id="ficheLieu"
        type="text"
        placeholder="Ajouter un lieu..."
        autocomplete="off"
    >

    <div
        id="lieuSuggestions"
        class="suggestions">
    </div>

</div>

        <textarea
            id="ficheDescription"
            placeholder="Ajouter une description..."
        ></textarea>

    </div>

</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>



</body>
</html>
