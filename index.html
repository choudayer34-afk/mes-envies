 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>EnVie</title>


    <meta name="theme-color" content="#6FAFC4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EnVie">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🌱
    </div>

    <h1>EnVie</h1>

    <p>
        Toutes nos idées,
        <br>
        au même endroit.
    </p>

</header>

<main>

    <button id="btnEnvie" class="mainButton">

        <span class="emoji">
            💡
        </span>

        <span>
            Une envie
        </span>

    </button>

    <section class="card">

        <h2>
            Bienvenue 👋
        </h2>

        <p>
            EnVie est votre mémoire familiale.
            Capturez une idée en quelques secondes,
            puis enrichissez-la plus tard.
        </p>

    </section>
<section class="inboxSection">

 <h2
    id="inboxTitle"
    class="sectionTitle"
>
    📥 À trier
</h2>


    <section id="enviesContainer"></section>

</section>



</main>
<div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal">

        <h2>Nouvelle envie</h2>

        <input
            id="envieInput"
            type="text"
            placeholder="Mon envie..."
        >
        <label class="fieldTitle">
    Catégorie
</label>
        <div id="categorieSelector" class="categorieSelector">

    <button class="categorieChip active"
            data-categorie="general">
        💡 Idée
    </button>

    <button class="categorieChip"
            data-categorie="voyage">
        ✈️ Voyage
    </button>

    <button class="categorieChip"
            data-categorie="maison">
        🏠 Maison
    </button>

    <button class="categorieChip"
            data-categorie="jardin">
        🌿 Jardin
    </button>

    <button class="categorieChip"
            data-categorie="courses">
        🛒 Courses
    </button>

    <button class="categorieChip"
            data-categorie="evenement">
        📅 Sortie
    </button>

</div>
<div class="field">

    <label class="fieldTitle">
        Lieu
    </label>

    <input
        id="envieLieu"
        type="text"
        placeholder="Ajouter un lieu">
<div
    id="lieuSuggestions"
    class="lieuSuggestions">

</div>
<button
    id="btnLocate"
    class="locationButton">

    📍 Utiliser ma position

</button>

    <div id="lieuSuggestions"></div>

</div>
<div class="field">

<label class="fieldTitle">
    Date ou période
</label>

<button
    id="chooseDate"
    class="dateButton">

    <span id="dateLabel">
        Choisir...
    </span>

    <span>
        ▾
    </span>

</button>

<input
    id="envieDate"
    type="date"
    hidden>

</div>
        <div class="modal-actions">

  <button
    id="cancelModal"
    class="secondaryButton">

    Annuler

</button>

<button
    id="saveEnvie"
    class="primaryButton">

    Ajouter

</button>

        </div>


    </div>

</div>

<div
    id="deleteModal"
    class="modal-overlay hidden">

    <div class="modal">

        <h2>🗑️ Supprimer ?</h2>

        <p id="deleteText">
            Cette envie sera supprimée définitivement.
        </p>

        <div class="modal-actions">

            <button id="cancelDelete">
                Annuler
            </button>

            <button id="confirmDelete">
                Supprimer
            </button>

        </div>

    </div>

</div>
<div id="ficheOverlay" class="modal-overlay hidden">

    <div class="modal">

        <button
            id="closeFiche"
            class="backButton">

            ← Retour

        </button>

        <h2 id="ficheTitre"></h2>

        <p id="ficheCategorie"></p>
        <div class="ficheSection">

    <label>📍 Lieu</label>

    <input
        id="ficheLieu"
        type="text"
        placeholder="Ajouter un lieu..."
        autocomplete="off"
    >

    <div
        id="lieuSuggestions"
        class="suggestions">
    </div>

</div>

        <textarea
            id="ficheDescription"
            placeholder="Ajouter une description..."
        ></textarea>

    </div>

</div>
<div id="dateModal" class="modal-overlay hidden">

    <div class="modal">

        <h2>Date ou période</h2>

        <div class="dateChoices">

            <button class="dateChoice" data-value="today">
                📅 Aujourd'hui
            </button>

            <button class="dateChoice" data-value="tomorrow">
                🌅 Demain
            </button>

            <button class="dateChoice" data-value="weekend">
                🏖️ Ce week-end
            </button>

            <button class="dateChoice" data-value="custom">
                📆 Choisir une date…
            </button>

        </div>

        <div class="modal-actions">

            <button
                id="cancelDate"
                class="secondaryButton">

                Annuler

            </button>

        </div>

    </div>

</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>



</body>
</html>
