 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>EnVie</title>

    <meta name="theme-color" content="#6FAFC4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EnVie">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🌱
    </div>

    <h1>EnVie</h1>

    <p>
        Toutes nos idées,
        <br>
        au même endroit.
    </p>

</header>

<main>

    <button id="btnEnvie" class="mainButton">

        <span class="emoji">
            💡
        </span>

        <span>
            Une envie
        </span>

    </button>

    <section class="card">

        <h2>
            Bienvenue 👋
        </h2>

        <p>
            EnVie est votre mémoire familiale.
            Capturez une idée en quelques secondes,
            puis enrichissez-la plus tard.
        </p>

    </section>
<section id="enviesContainer"></section>


</main>
<div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal">

        <h2>💡 Une envie</h2>

        <input
            id="envieInput"
            type="text"
            placeholder="Mon envie..."
        >

        <div class="modalActions">

            <button id="cancelModal">
                Annuler
            </button>

            <button id="saveEnvie">
                Ajouter
            </button>

        </div>

    </div>

</div>

<div id="toast"></div>
<script type="module" src="app.js"></script>

</body>
</html>
